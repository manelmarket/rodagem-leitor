name: Gerar APK

on:
  push:
    branches:
      - main

  workflow_dispatch:


permissions:
  contents: write


jobs:
  apk:

    runs-on: ubuntu-22.04

    steps:

      - name: Baixar código
        uses: actions/checkout@v4


      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      - name: Preparar Android Command Line Tools
        run: |
          echo "Listando ferramentas Android"
          ls $ANDROID_SDK_ROOT/cmdline-tools

          if [ -d "$ANDROID_SDK_ROOT/cmdline-tools/16.0" ]; then
            mv $ANDROID_SDK_ROOT/cmdline-tools/16.0 $ANDROID_SDK_ROOT/cmdline-tools/latest
          fi


      - name: Configurar Android SDK manualmente
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV

          export PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH

          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"


      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'


      - name: Chave de assinatura
        env:
          CHAVE: ${{ secrets.LEITOR_KEYSTORE }}
        run: |
          if [ -z "$CHAVE" ]; then
            echo "::error::Falta o segredo LEITOR_KEYSTORE. Cadastre em Settings > Secrets and variables"
            exit 1
          fi

          echo "$CHAVE" | base64 -d > app/leitor.jks


      - name: Compilar
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon


      - name: Renomear APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk rodagem-leitor-${{ github.run_number }}.apk


      - name: Publicar para baixar no celular
        uses: softprops/action-gh-release@v2
        with:
          tag_name: leitor-${{ github.run_number }}
          name: Rodagem Leitor ${{ github.run_number }}
          body: Baixe o arquivo APK abaixo diretamente no celular.
          files: rodagem-leitor-${{ github.run_number }}.apk
          make_latest: true
